name: FloatChat 24/7 Keep-Alive Guard

on:
  schedule:
    # Runs every 15 minutes to prevent Streamlit Community Cloud from going to sleep
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping-keep-alive:
    name: Ping Streamlit Cloud & Verify Zero Downtime
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping to FloatChat Live Deployment
        run: |
          URL="https://floatchat-argo-ocean-t7cjszmnhgb34rt6jnpgvz.streamlit.app/"
          echo "Sending keep-alive ping to: $URL"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L -m 25 "$URL" || echo "failed")
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "304" ]; then
            echo "✅ FloatChat Streamlit Cloud app is ACTIVE and AWAKE!"
          else
            echo "⚠️ Ping received status $HTTP_STATUS (attempting wake-up trigger)..."
            curl -s -L -m 30 "$URL" > /dev/null || true
          fi
